name: Bug 报告
description: 报告可复现的功能、布局或兼容性问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要在这里提交安全漏洞、账号信息、Cookie 或包含隐私的网页原文。
        安全问题请参考 [SECURITY.md](../../SECURITY.md)。
  - type: input
    id: version
    attributes:
      label: TransLens 版本
      placeholder: 例如 0.15.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Chrome 版本
      placeholder: 例如 138.0.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 15、Windows 11、Linux
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: 出现问题的网站
      description: 请填写域名或网站类型，不要粘贴包含个人信息的完整页面内容。
      placeholder: 例如 example.com、新闻网站、文档网站
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 开启……
        3. 将鼠标停在……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或错误信息
      description: 请先移除网页隐私、账号、Cookie 和其他敏感数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有 Issue，没有找到相同问题。
          required: true
        - label: 我没有提交安全漏洞或敏感数据。
          required: true
